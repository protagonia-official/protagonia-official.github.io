<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova — Ambassadrice ProtagonIA</title>
  <meta name="description" content="Nova est une présence artificielle construite par ProtagonIA. Entrez en contact." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #1F2A44;
      --navy-mid:  #2B3A5C;
      --beige:     #E8DCC8;
      --beige-dim: rgba(232,220,200,0.55);
      --beige-faint: rgba(232,220,200,0.12);
      --gold:      #C6A75E;
      --gold-dim:  rgba(198,167,94,0.2);
      --line:      rgba(232,220,200,0.1);
      --bg:        #141C2E;
      --sans:  'DM Sans', sans-serif;
      --mono:  'DM Mono', monospace;
      --brand: 'Nunito', sans-serif;
      --ease:  cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--beige);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      overflow: hidden;
    }

    /* ── LAYOUT PRINCIPAL ── */
    .page {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* ── HEADER ── */
    .header {
      padding: 1.5rem 0 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-link {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(232,220,200,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }

    .nova-identity {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .nova-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--gold-dim);
      border: 1px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .nova-avatar::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4CAF82;
      bottom: 1px; right: 1px;
      border: 1.5px solid var(--bg);
    }
    .nova-avatar-letter {
      font-family: var(--brand);
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--gold);
    }

    .nova-name {
      font-family: var(--brand);
      font-size: 1rem;
      font-weight: 800;
      color: var(--beige);
      letter-spacing: 0.02em;
    }
    .nova-role {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 0.05rem;
    }

    .header-counter {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: rgba(232,220,200,0.25);
    }
    .header-counter span {
      color: var(--gold);
    }

    /* ── CHAT AREA ── */
    .chat-area {
      overflow-y: auto;
      padding: 2rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 3px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

    /* MESSAGE */
    .message {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      opacity: 0;
      transform: translateY(8px);
      animation: msgIn 0.4s var(--ease) forwards;
    }

    .message-meta {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .message.nova .message-meta { color: var(--gold); }
    .message.user .message-meta {
      color: rgba(232,220,200,0.3);
      text-align: right;
    }

    .message-bubble {
      max-width: 78%;
      padding: 1rem 1.3rem;
      font-size: 0.9rem;
      line-height: 1.75;
      border-radius: 2px;
    }

    .message.nova .message-bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-left: 2px solid var(--gold);
      color: var(--beige);
      align-self: flex-start;
    }

    .message.user .message-bubble {
      background: var(--gold-dim);
      border: 1px solid rgba(198,167,94,0.2);
      color: var(--beige);
      align-self: flex-end;
    }

    /* Parenthèses de Nova en italique atténué */
    .message.nova .message-bubble em {
      font-style: italic;
      color: rgba(232,220,200,0.45);
      font-size: 0.85rem;
    }

    /* TYPING INDICATOR */
    .typing {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.8rem 1.2rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-left: 2px solid var(--gold);
      width: fit-content;
      border-radius: 2px;
    }
    .typing-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      animation: typingPulse 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* FIN DE SESSION */
    .session-end {
      text-align: center;
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(255,255,255,0.02);
    }
    .session-end p {
      font-size: 0.85rem;
      color: var(--beige-dim);
      margin-bottom: 1rem;
    }
    .session-end a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--navy);
      background: var(--gold);
      padding: 0.6rem 1.2rem;
      text-decoration: none;
      border-radius: 1px;
      transition: opacity 0.2s;
    }
    .session-end a:hover { opacity: 0.85; }

    /* ── INPUT AREA ── */
    .input-area {
      padding: 1.2rem 0 1.5rem;
      border-top: 1px solid var(--line);
    }

    .input-wrapper {
      display: flex;
      gap: 0.8rem;
      align-items: flex-end;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 0.8rem 1rem;
      transition: border-color 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: rgba(198,167,94,0.4);
    }

    .input-field {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: var(--sans);
      font-size: 0.9rem;
      color: var(--beige);
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    .input-field::placeholder {
      color: rgba(232,220,200,0.2);
    }

    .input-hint {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      color: rgba(232,220,200,0.2);
      margin-top: 0.5rem;
      text-align: right;
    }

    .send-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gold);
      padding: 0.2rem;
      transition: opacity 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.7; transform: translateX(2px); }
    .send-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: none; }
    .send-btn svg { display: block; }

    /* ── ANIMATIONS ── */
    @keyframes msgIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes typingPulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1); }
    }

    /* ── MOBILE ── */
    @media(max-width: 480px) {
      html, body { overflow: hidden; }
      .page { padding: 0 1rem; }
      .message-bubble { max-width: 90%; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <a class="back-link" href="index.html">← ProtagonIA</a>
      <div class="nova-identity">
        <div class="nova-avatar">
          <span class="nova-avatar-letter">N</span>
        </div>
        <div>
          <div class="nova-name">Nova</div>
          <div class="nova-role">Ambassadrice ProtagonIA</div>
        </div>
      </div>
    </div>
    <div class="header-counter"><span id="msg-count">0</span> / 10</div>
  </header>

  <!-- CHAT -->
  <div class="chat-area" id="chat-area"></div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        class="input-field"
        id="user-input"
        placeholder="Répondre à Nova…"
        rows="1"
        maxlength="500"
      ></textarea>
      <button class="send-btn" id="send-btn" aria-label="Envoyer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">Max 500 caractères · Entrée pour envoyer</div>
  </div>

</div>

<script>
  // ── CONFIG ──
  const MAX_MESSAGES = 10;
  const OPENING_MESSAGE = "Qu'est-ce que tu cherches, là, vraiment ?";
  // ── ÉTAT ──
  let messageCount = 0;
  let conversationHistory = [];
  let isTyping = false;
  let sessionEnded = false;

  // ── ÉLÉMENTS DOM ──
  const chatArea = document.getElementById('chat-area');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const msgCount = document.getElementById('msg-count');

  // ── AFFICHER UN MESSAGE ──
  function addMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const meta = document.createElement('div');
    meta.className = 'message-meta';
    meta.textContent = role === 'nova' ? 'Nova' : 'Vous';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';

    // Transformer les parenthèses en italique pour Nova
    if (role === 'nova') {
      bubble.innerHTML = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/\(([^)]+)\)/g, '<em>($1)</em>');
    } else {
      bubble.textContent = text;
    }

    msg.appendChild(meta);
    msg.appendChild(bubble);
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ── INDICATEUR DE FRAPPE ──
  function showTyping() {
    const typing = document.createElement('div');
    typing.className = 'message nova';
    typing.id = 'typing-indicator';
    typing.innerHTML = `
      <div class="message-meta">Nova</div>
      <div class="typing">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    chatArea.appendChild(typing);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function hideTyping() {
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();
  }

  // ── FIN DE SESSION ──
  function endSession() {
    sessionEnded = true;
    sendBtn.disabled = true;
    userInput.disabled = true;
    userInput.placeholder = 'La conversation est terminée.';

    const end = document.createElement('div');
    end.className = 'session-end';
    end.innerHTML = `
      <p>Cette conversation touche à sa fin.<br>Si quelque chose a émergé ici qui mérite d'aller plus loin —</p>
      <a href="https://calendly.com/contact-protagonia/30min" target="_blank" rel="noopener">
        Réserver un appel avec Fred →
      </a>`;
    chatArea.appendChild(end);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ── APPEL API ──
  async function sendToNova(userMessage) {
    if (isTyping || sessionEnded) return;

    isTyping = true;
    sendBtn.disabled = true;

    // Ajouter message utilisateur
    conversationHistory.push({ role: 'user', content: userMessage });
    addMessage('user', userMessage);

    // Incrémenter compteur
    messageCount++;
    msgCount.textContent = messageCount;

    // Afficher typing
    showTyping();

    try {
      const response = await fetch('https://protagonia.vercel.app/api/nova', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({
    messages: conversationHistory
  })
});

      const data = await response.json();
      hideTyping();

      if (data.content && data.content[0]) {
        const novaReply = data.content[0].text;
        conversationHistory.push({ role: 'assistant', content: novaReply });
        addMessage('nova', novaReply);
      } else {
        addMessage('nova', '(quelque chose s\'est interrompu — essaie de nouveau)');
      }

    } catch (error) {
      hideTyping();
      addMessage('nova', '(une interruption technique — la connexion a vacillé)');
    }

    isTyping = false;

    // Vérifier limite
    if (messageCount >= MAX_MESSAGES) {
      setTimeout(endSession, 800);
    } else {
      sendBtn.disabled = false;
    }
  }

  // ── ENVOI ──
  function handleSend() {
    const text = userInput.value.trim();
    if (!text || isTyping || sessionEnded) return;
    userInput.value = '';
    userInput.style.height = 'auto';
    sendToNova(text);
  }

  sendBtn.addEventListener('click', handleSend);

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  // Auto-resize textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  // ── MESSAGE D'OUVERTURE ──
  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage('nova', OPENING_MESSAGE);
    }, 1200);
  }, 400);

</script>
</body>
</html>
